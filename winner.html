<!-- Firebase v10 Modular SDK 引入 (CDN 版) -->
<script type="module">
    // 1. 從 CDN 引入需要的 Firebase 功能
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";

    // 2. 貼上您的專屬 Firebase 設定
    const firebaseConfig = {
        apiKey: "AIzaSyC5GOWxzm3JtaMqRmaZYjkJiq59CIQ_ogk",
        authDomain: "whoisthewinner.firebaseapp.com",
        databaseURL: "https://whoisthewinner-default-rtdb.firebaseio.com",
        projectId: "whoisthewinner",
        storageBucket: "whoisthewinner.firebasestorage.app",
        messagingSenderId: "444059736442",
        appId: "1:444059736442:web:b2e349c0b8ad4a37f7dec3",
        measurementId: "G-WG6NCVMWNW"
    };

    // 3. 初始化 Firebase 與 Realtime Database
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    // ================= 以下為遊戲邏輯 =================
    
    // 全域變數
    let myId = Math.random().toString(36).substr(2, 9); // 產生隨機ID
    let myRoom = "";
    let myName = "";
    let isHost = false;
    let myTeam = "";

    // 畫面切換函數
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ================= 1. 建立 / 加入房間邏輯 =================
    document.getElementById('btn-create').addEventListener('click', async () => {
        myRoom = document.getElementById('input-room').value.trim();
        myName = document.getElementById('input-name').value.trim();
        if(!myRoom || !myName) return alert("請輸入完整資訊");
        
        isHost = true;
        const roomRef = ref(db, `rooms/${myRoom}`);
        
        // 初始化房間資料結構
        await set(roomRef, {
            status: 'waiting',
            hostId: myId,
            players: { [myId]: { name: myName, role: 'host' } },
            teams: {
                left: { hp: 5, name: '左隊' },
                right: { hp: 5, name: '右隊' }
            },
            gameState: { currentTurn: 'left', stage: 'pre_answer' }
        });
        enterLobby();
    });

    document.getElementById('btn-join').addEventListener('click', async () => {
        myRoom = document.getElementById('input-room').value.trim();
        myName = document.getElementById('input-name').value.trim();
        if(!myRoom || !myName) return alert("請輸入完整資訊");

        const roomSnap = await get(ref(db, `rooms/${myRoom}`));
        if(!roomSnap.exists()) return alert("房間不存在！");

        isHost = false;
        await update(ref(db, `rooms/${myRoom}/players/${myId}`), { name: myName, team: '' });
        enterLobby();
    });

    // ================= 2. 準備大廳邏輯 (監聽狀態) =================
    function enterLobby() {
        showScreen('screen-lobby');
        document.getElementById('display-room').innerText = myRoom;
        if(isHost) document.getElementById('host-lobby-controls').style.display = 'block';

        const roomRef = ref(db, `rooms/${myRoom}`);
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if(!data) {
                alert("房間已解散");
                window.location.reload();
                return;
            }

            if(data.status === 'playing') {
                showScreen('screen-game');
                renderGameUI(data);
                return;
            }

            let leftHtml = '', rightHtml = '';
            for(let uid in data.players) {
                const p = data.players[uid];
                if(p.role === 'host') continue; 
                
                let kickBtn = isHost ? `<button onclick="kickPlayer('${uid}')">踢出</button>` : '';
                
                if(p.team === 'left') leftHtml += `<li>${p.name} ${kickBtn}</li>`;
                if(p.team === 'right') rightHtml += `<li>${p.name} ${kickBtn}</li>`;
            }
            document.getElementById('list-left').innerHTML = leftHtml;
            document.getElementById('list-right').innerHTML = rightHtml;
        });
    }

    document.getElementById('btn-join-left').addEventListener('click', () => {
        myTeam = 'left';
        update(ref(db, `rooms/${myRoom}/players/${myId}`), { team: 'left' });
    });
    document.getElementById('btn-join-right').addEventListener('click', () => {
        myTeam = 'right';
        update(ref(db, `rooms/${myRoom}/players/${myId}`), { team: 'right' });
    });

    window.kickPlayer = (uid) => {
        remove(ref(db, `rooms/${myRoom}/players/${uid}`));
    };

    document.getElementById('btn-start-game').addEventListener('click', () => {
        update(ref(db, `rooms/${myRoom}`), { status: 'playing' });
    });

    // ================= 3. 遊戲內核心邏輯 =================
    function renderGameUI(data) {
        document.getElementById('hp-left').innerText = '❤️'.repeat(data.teams.left.hp);
        document.getElementById('hp-right').innerText = '❤️'.repeat(data.teams.right.hp);
        
        const turn = data.gameState.currentTurn;
        document.getElementById('game-status-text').innerText = `現在輪到：${turn === 'left' ? '左隊' : '右隊'} 答題`;

        if(isHost) {
            document.getElementById('host-panel').style.display = 'block';
            document.getElementById('student-panel').style.display = 'none';
            document.getElementById('host-current-team').innerText = turn;
        } else {
            document.getElementById('host-panel').style.display = 'none';
            if(myTeam === turn && data.gameState.stage === 'pre_answer') {
                document.getElementById('student-panel').style.display = 'block';
            } else {
                document.getElementById('student-panel').style.display = 'none';
            }
        }
    }

    document.getElementById('btn-correct').addEventListener('click', () => {
        alert("實作點：跳出對話框讓隊伍選擇「回血、扣對方血、或發動技能」");
        switchTurn();
    });

    document.getElementById('btn-wrong').addEventListener('click', async () => {
        const snap = await get(ref(db, `rooms/${myRoom}`));
        const currentTurn = snap.val().gameState.currentTurn;
        let hp = snap.val().teams[currentTurn].hp - 1;
        
        if(hp <= 0) {
            update(ref(db, `rooms/${myRoom}`), { status: 'mercy_vote' });
            alert(`${currentTurn} 隊血量歸零！觸發對手投票機制！`);
        } else {
            await update(ref(db, `rooms/${myRoom}/teams/${currentTurn}`), { hp: hp });
            switchTurn();
        }
    });

    async function switchTurn() {
        const snap = await get(ref(db, `rooms/${myRoom}`));
        const current = snap.val().gameState.currentTurn;
        const next = current === 'left' ? 'right' : 'left';
        update(ref(db, `rooms/${myRoom}/gameState`), { currentTurn: next, stage: 'pre_answer' });
    }
</script>
